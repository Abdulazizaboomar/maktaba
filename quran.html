    }
  }
  // أقرب سورة متوفرة في اتجاه معيّن (للتالي والسابق والتشغيل المتتابع)
  function near(i, d) { for (let k = 1; k <= 114; k++) { const j = ((i + d * k) % 114 + 114) % 114; if (has(j)) return j; } return -1; }
  function play(i, at = 0, open = false) {
    i = (i + 114) % 114;
    if (!has(i)) { const j = near(i - 1, 1); if (j < 0) return toast("لا توجد سور متوفرة بعد"); i = j; at = 0; }
    if (i !== cur) { cur = i; retries = 0; pendingSeek = at || 0; audio.src = url(i); audio.playbackRate = rate; setInfo(i); paint(0, 0); }
    else if (at) audio.currentTime = at;
    $("qp").classList.add("loading");
    const p = audio.play(); if (p && p.catch) p.catch((e) => { if (e && e.name === "NotAllowedError") { $("qp").classList.remove("loading"); setIcon(PLAY); } });
    if (open) openSheet();
    store.set("q:last", JSON.stringify({ i, t: at || 0 }));
  }
  function toggle() { if (cur < 0) { const l = last(); return play(l ? l.i : 0, l ? l.t : 0); } audio.paused ? play(cur) : audio.pause(); }
  const next = () => { const j = near(cur, 1); if (j >= 0) play(j); }, prev = () => { if (audio.currentTime > 5) audio.currentTime = 0; else { const j = near(cur, -1); if (j >= 0) play(j); } };
  function paint(t, d) {
    const k = d ? Math.min(1, t / d) : 0;
    $("qpRing").style.strokeDashoffset = C1 * (1 - k); $("qsRing").style.strokeDashoffset = C2 * (1 - k);
    $("qpTime").textContent = d ? fmt(t) + " / " + fmt(d) : fmt(t);
    $("qsCur").textContent = fmt(t); $("qsDur").textContent = d ? fmt(d) : "0:00";
    if (!seeking) $("qsSeek").value = Math.round(k * 1000);
  }
  let seeking = false;
  audio.addEventListener("loadedmetadata", () => { if (pendingSeek && pendingSeek < audio.duration - 2) audio.currentTime = pendingSeek; pendingSeek = 0; });
  audio.addEventListener("timeupdate", () => {
    paint(audio.currentTime, audio.duration);
    const now = Date.now(); if (now - lastSave > 4000) { lastSave = now; store.set("q:last", JSON.stringify({ i: cur, t: Math.floor(audio.currentTime) })); }
    if (audio.duration && audio.currentTime / audio.duration > 0.92 && !done.has(cur)) { done.add(cur); tiles[cur].classList.add("done"); store.set("q:done", JSON.stringify([...done])); }
    if ("mediaSession" in navigator && navigator.mediaSession.setPositionState && audio.duration) { try { navigator.mediaSession.setPositionState({ duration: audio.duration, playbackRate: audio.playbackRate, position: audio.currentTime }); } catch (e) {} }
  });
  audio.addEventListener("playing", () => { retries = 0; $("qp").classList.remove("loading"); setIcon(PAUSE); tiles[cur] && tiles[cur].classList.add("playing"); });
  audio.addEventListener("waiting", () => $("qp").classList.add("loading"));
  audio.addEventListener("pause", () => { $("qp").classList.remove("loading"); setIcon(PLAY); tiles.forEach((t) => t.classList.remove("playing")); if (cur >= 0) store.set("q:last", JSON.stringify({ i: cur, t: Math.floor(audio.currentTime) })); });
  audio.addEventListener("ended", () => {
    const nx = near(cur, 1); store.set("q:last", JSON.stringify({ i: nx > cur ? nx : cur, t: 0 }));
    const m = MODES[mode][0];
    if (m === "one") { audio.currentTime = 0; audio.play(); } else if (m === "next" && nx > cur) { next(); } else { setIcon(PLAY); }
  });
  audio.addEventListener("error", () => {
    if (cur < 0 || !audio.src) return;
    if (retries < 2) { retries++; const at = audio.currentTime || 0; setTimeout(() => { pendingSeek = at; audio.src = url(cur) + (url(cur).includes("?") ? "&" : "?") + "r=" + retries; audio.play().catch(() => {}); }, 800 * retries); return; }
    $("qp").classList.remove("loading"); setIcon(PLAY); toast("تعذّر تشغيل السورة، تحقق من الاتصال ثم حاول مرة أخرى");
  });

  // أزرار
  $("qpPlay").onclick = $("qsPlay").onclick = toggle;
  $("qpNext").onclick = $("qsNext").onclick = next;
  $("qpPrev").onclick = $("qsPrev").onclick = prev;
  $("qsFwd").onclick = () => { if (audio.duration) audio.currentTime = Math.min(audio.duration - 1, audio.currentTime + 10); };
  $("qsBack").onclick = () => { audio.currentTime = Math.max(0, audio.currentTime - 10); };
  $("qsMode").onclick = () => { mode = (mode + 1) % MODES.length; store.set("q:mode", MODES[mode][0]); paintMode(); toast(MODES[mode][1]); };
  $("qsRate").onclick = () => { rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length]; store.set("q:rate", String(rate)); paintRate(); };
  const sk = $("qsSeek");
  sk.addEventListener("input", () => { seeking = true; if (audio.duration) $("qsCur").textContent = fmt(audio.duration * sk.value / 1000); });
  sk.addEventListener("change", () => { if (audio.duration) audio.currentTime = audio.duration * sk.value / 1000; seeking = false; });
  function openSheet() { $("qs").classList.add("open"); document.body.style.overflow = "hidden"; }
  function closeSheet() { $("qs").classList.remove("open"); document.body.style.overflow = ""; }
  $("qpMed").onclick = $("qpInfo").onclick = openSheet; $("qsClose").onclick = closeSheet;
  // ✕ إيقاف التلاوة وإغلاق المشغّل (ويبقى «تابع الاستماع» محفوظاً)
  function stopAll() {
    if (cur >= 0) store.set("q:last", JSON.stringify({ i: cur, t: Math.floor(audio.currentTime || 0) }));
    audio.pause(); audio.removeAttribute("src"); try { audio.load(); } catch (e) {}
    cur = -1; tiles.forEach((t) => t.classList.remove("cur", "playing"));
    $("qp").classList.remove("on", "loading"); setIcon(PLAY); closeSheet(); paint(0, 0);
    $("qpPlay").onclick = $("qsPlay").onclick = toggle;
    if ("mediaSession" in navigator) { try { navigator.mediaSession.metadata = null; navigator.mediaSession.playbackState = "none"; } catch (e) {} }
  }
  $("qpStop").onclick = $("qsStop").onclick = stopAll;
  $("qs").addEventListener("click", (e) => { if (e.target.id === "qs") closeSheet(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeSheet();
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
    if (e.code === "Space" && cur >= 0) { e.preventDefault(); toggle(); }
  });
  if ("mediaSession" in navigator) {
    const ms = navigator.mediaSession, h = (a, f) => { try { ms.setActionHandler(a, f); } catch (e) {} };
    h("play", () => toggle()); h("pause", () => audio.pause()); h("nexttrack", next); h("previoustrack", () => { const j = near(cur, -1); if (j >= 0) play(j); });
    h("seekforward", () => $("qsFwd").onclick()); h("seekbackward", () => $("qsBack").onclick());
    h("seekto", (d) => { if (d.seekTime != null) audio.currentTime = d.seekTime; });
  }

  // تابع الاستماع
  function last() { try { const l = JSON.parse(store.get("q:last") || "null"); return l && l.i >= 0 && l.i < 114 ? l : null; } catch (e) { return null; } }
  function initCont() {
    const l = last(); if (!l || !has(l.i)) return;
    $("qCont").hidden = false; $("qContName").textContent = "سورة " + SUR[l.i][0]; $("qContTime").textContent = l.t ? "(" + fmt(l.t) + ")" : "";
    $("qCont").onclick = () => play(l.i, l.t, true);
    cur = -1; setInfo(l.i); tiles[l.i].classList.remove("cur"); $("qp").classList.add("on"); paint(0, 0);
    $("qpPlay").onclick = $("qsPlay").onclick = () => { if (cur < 0) play(l.i, l.t); else toggle(); };
  }
  // تحميل قائمة السور المرفوعة
  function note(t) { $("qNoteT").textContent = t; $("qNote").hidden = !t; }
  function applyFiles(files) {
    files.forEach((f) => { const m = f.name.match(/(?:^|\/)0*(\d{1,3})(?=\D|$)/); const n = m ? +m[1] : 0; if (n >= 1 && n <= 114 && !SRC[n - 1]) SRC[n - 1] = f.url; });
    let n = 0; tiles.forEach((b, i) => { const ok = has(i); b.disabled = !ok; b.classList.toggle("soon", !ok); if (ok) n++; });
    if (n && n < 114) {
      $("qProg").hidden = false; $("qProgT").textContent = "متوفر الآن " + enN(n) + " من 114 سورة، وتُضاف بقية السور تباعاً بإذن الله";
      $("qProgBar").style.width = Math.max(2, n / 114 * 100) + "%"; $("segAvail").hidden = false;
    }
    if (!n) note("التلاوة قيد الرفع، وستظهر السور هنا تباعاً بإذن الله.");
    filter(); initCont();
  }
  // ملفات الموقع أولاً (LOCAL)، ثم archive.org؛ وإذا تعذّر archive.org تبقى ملفات الموقع شغّالة
  if (!ITEM && !LOCAL.length) note("المصحف المرتّل قيد الإعداد، وستظهر السور هنا تباعاً بإذن الله.");
  else if (!ITEM) applyFiles(LOCAL);
  else {
    grid.classList.add("wait");
    iaFiles(ITEM).then((f) => applyFiles(LOCAL.concat(f)), () => LOCAL.length ? applyFiles(LOCAL) : note("تعذّر تحميل قائمة السور الآن، تحقق من الاتصال ثم حدّث الصفحة."))
      .finally(() => grid.classList.remove("wait"));
  }
  const bar = $("qBar"); addEventListener("scroll", () => { bar.classList.toggle("stuck", bar.getBoundingClientRect().top <= $("topbar").offsetHeight + 1); }, { passive: true });
})();
</script>
</body>
</html>
